name: PostgreSQL Image CI

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/postgres/**"
      - ".github/workflows/postgres-image.yml"
  push:
    branches: [main]
    paths:
      - "deploy/postgres/**"
      - ".github/workflows/postgres-image.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build PostgreSQL image
        run: |
          docker build \
            --file deploy/postgres/Dockerfile \
            --tag shop-postgres:16.9-ci \
            deploy/postgres
