name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: >-
          Deploy a single service (userservice, catalogservice, paymentservice,
          spotservice or errandservice). Leave empty to auto-detect from changes.
        required: false
        type: string
        default: ""

# Deploys must never be cancelled mid-SSH (tag rotation could be left
# half-done). Queued runs deploy in order; the newest sha deploys last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      mode: deploy
      dispatch-service: ${{ inputs.service || '' }}

  build-push:
    name: Build & push (${{ matrix.service }})
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    env:
      # TCR repo naming: <USERNAME>/<IMAGE_PREFIX>-<service>, e.g. sast/sast-shop-paymentservice
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'sast-shop' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - name: Check required configuration
        run: |
          if [ -z "${{ vars.TCR_USERNAME }}" ]; then
            echo "::error::Repository variable TCR_USERNAME is not set. Add it under Settings → Secrets and variables → Actions → Variables." >&2
            exit 1
          fi

      - name: Short sha
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ccr.ccs.tencentyun.com/${{ vars.TCR_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy (${{ matrix.service }})
    needs: build-push
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'sast-shop' }}
    strategy:
      fail-fast: false
      # Load-bearing: parallel legs would interleave `compose up` and
      # `image prune` against the single compose project on the server.
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Short sha
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TODO: pin the action to a full commit SHA after the first successful
      # run, matching the convention in buf.yml.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          SVC: ${{ matrix.service }}
          SHA: ${{ steps.meta.outputs.sha }}
          TCR_USERNAME: ${{ vars.TCR_USERNAME }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR || '/data/sast-shop-v2' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SVC,SHA,TCR_USERNAME,IMAGE_PREFIX,COMPOSE_DIR
          command_timeout: 10m
          # Runs on the server (POSIX sh compatible; not bash-only).
          script: |
            set -eu
            cd "$COMPOSE_DIR"
            REMOTE="ccr.ccs.tencentyun.com/$TCR_USERNAME/${IMAGE_PREFIX}-${SVC}:${SHA}"

            # Public repo, anonymous pull; retry 3x (TCR shared storage may lag after push).
            for i in 1 2 3; do
              if docker pull "$REMOTE"; then break; fi
              if [ "$i" = "3" ]; then
                echo "pull failed after 3 attempts: $REMOTE" >&2
                exit 1
              fi
              echo "pull failed ($i/3), retrying in 5s..."
              sleep 5
            done

            # Rotate current -> backup (deleting the previous backup).
            # First-ever deploy: current does not exist yet — skip.
            docker image inspect "sast/$SVC:backup" >/dev/null 2>&1 && docker rmi "sast/$SVC:backup" || true
            if docker image inspect "sast/$SVC:current" >/dev/null 2>&1; then
              docker tag "sast/$SVC:current" "sast/$SVC:backup"
            fi
            docker tag "$REMOTE" "sast/$SVC:$SHA"
            docker tag "$REMOTE" "sast/$SVC:current"
            docker rmi "$REMOTE" || true

            # Upgrade only the changed service; compose recreates it only when
            # the image ID behind sast/<svc>:current changed (rotation above).
            docker compose up -d --no-deps --remove-orphans "$SVC"

            docker image prune -f
