name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: >-
          Deploy a single service (userservice, catalogservice, paymentservice,
          spotservice, errandservice or westpocketservice). Leave empty to auto-detect from changes.
        required: false
        type: string
        default: ""

# Deploys must never be cancelled mid-SSH (tag rotation could be left
# half-done). Queued runs deploy in order; the newest sha deploys last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      mode: deploy
      dispatch-service: ${{ inputs.service || '' }}

  build-push:
    name: Build & push (${{ matrix.service }})
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    env:
      # TCR repo naming: <namespace>/<IMAGE_PREFIX>-<service>, e.g. sast/sast-shop-paymentservice
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'sast-shop' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - name: Check required configuration
        run: |
          if [ -z "${{ vars.TCR_NAMESPACE }}" ]; then
            echo "::error::Repository variable TCR_NAMESPACE is not set. Add it under Settings → Secrets and variables → Actions → Variables." >&2
            exit 1
          fi

      - name: Short sha
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ccr.ccs.tencentyun.com/${{ vars.TCR_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.sha }}
            ccr.ccs.tencentyun.com/${{ vars.TCR_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy (${{ matrix.service }})
    needs: [changes, build-push]
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'sast-shop' }}
      TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
      DEPLOY_SSH_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    strategy:
      fail-fast: false
      # Server releases share one Compose project and deployment lock.
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Deploy immutable image through server helper
        shell: bash
        env:
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SVC" in
            userservice|catalogservice|paymentservice|spotservice|errandservice|westpocketservice) ;;
            *) echo "Unknown backend service" >&2; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || exit 1
          [[ "$IMAGE_PREFIX" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || exit 1
          [[ "$DEPLOY_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_KEY"

          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          ssh-keyscan -T 10 -t ed25519 -- "$DEPLOY_SSH_HOST" > "$ssh_dir/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$DEPLOY_SSH_FINGERPRINT" ]; then
            echo "Server ED25519 host key does not match SERVER_SSH_FINGERPRINT" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"

          registry_payload="$(node -e '
            const credentials = {
              registry: "ccr.ccs.tencentyun.com",
              username: process.env.TCR_USERNAME,
              password: process.env.TCR_PASSWORD,
            };
            if (Object.values(credentials).some((value) => typeof value !== "string" || !value.trim() || /[\r\n\0]/.test(value))) {
              console.error("Registry credentials must be nonempty strings without line breaks");
              process.exit(1);
            }
            const payload = JSON.stringify(credentials);
            if (Buffer.byteLength(payload) > 16 * 1024) {
              console.error("Registry credentials exceed the helper stdin limit");
              process.exit(1);
            }
            process.stdout.write(payload);
          ')"
          remote_image="ccr.ccs.tencentyun.com/$TCR_NAMESPACE/${IMAGE_PREFIX}-${SVC}:sha-$GITHUB_SHA"
          remote_command="sudo -n /usr/local/lib/sast-shop/deploy-image $SVC $GITHUB_SHA $remote_image --registry-stdin"
          printf '%s' "$registry_payload" | timeout 10m ssh -F /dev/null \
            -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -l "$DEPLOY_SSH_USER" -- "$DEPLOY_SSH_HOST" "$remote_command"
