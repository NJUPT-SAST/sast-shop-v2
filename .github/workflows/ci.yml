name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  GO_VERSION: "1.26"

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      mode: ci

  lint:
    name: Lint (${{ matrix.module }})
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            internal/pkg/go.sum
            internal/service/userservice/go.sum
            internal/service/catalogservice/go.sum
            internal/service/paymentservice/go.sum
            internal/service/spotservice/go.sum
            internal/service/errandservice/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        run: make proto

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  build:
    name: Build (${{ matrix.module }})
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        run: make proto

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # TODO: uncomment after tests are added
      # - name: Test
      #   working-directory: ${{ matrix.module }}
      #   run: go test -race -count=1 ./...
      # For integration tests (PostgreSQL/Redis), consider testcontainers-go
