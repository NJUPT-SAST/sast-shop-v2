version: 2

updates:
  # Go modules: 6 modules under one glob so one bump = one PR, not six.
  - package-ecosystem: "gomod"
    directories:
      - "/internal/pkg"
      - "/internal/service/*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "go"]
    open-pull-requests-limit: 4
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 2
    groups:
      ci-actions:
        patterns: ["*"]
